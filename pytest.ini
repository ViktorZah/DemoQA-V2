[pytest]
testpaths = selenium_tests playwright_tests
pythonpath = .
addopts =
    -v
    --strict-markers
    --html=reports/report.html
    --self-contained-html
    --screenshot=only-on-failure
    --tracing=retain-on-failure
    --output=reports/playwright
markers =
    smoke: Quick checks that the main paths work
    regression: The full test suite
